<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>

    {% if page.canonical_path %}
    <link rel="canonical" href="{{ page.canonical_path | absolute_url }}">
    {% else %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    {% endif %}
    {% if page.alternates %}
    {% for alternate in page.alternates %}
    <link rel="alternate" hreflang="{{ alternate[0] }}" href="{{ alternate[1] | absolute_url }}">
    {% endfor %}
    {% else %}
    {% if page.alternate_en %}
    <link rel="alternate" hreflang="en" href="{{ page.alternate_en | absolute_url }}">
    {% endif %}
    {% if page.alternate_bg %}
    <link rel="alternate" hreflang="bg" href="{{ page.alternate_bg | absolute_url }}">
    {% endif %}
    {% endif %}

    <!-- Use the theme CSS + your overrides -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body class="no-sidebar">
    <main class="content-wrapper" role="main">
      {{ content }}
    </main>
  </body>
</html>
